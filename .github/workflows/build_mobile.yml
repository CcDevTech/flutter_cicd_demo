name: Build Android APK & Development IPA

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Android & iOS
    runs-on:
      - self-hosted
      - macOS

    steps:
      ####################################################
      # Checkout
      ####################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ####################################################
      # Runner Information
      ####################################################

      - name: Runner Details
        run: |
          echo "Runner Name : $RUNNER_NAME"
          echo "Runner OS   : $RUNNER_OS"
          echo "Runner Arch : $RUNNER_ARCH"
          echo "Hostname    : $(hostname)"
          pwd

      ####################################################
      # Flutter
      ####################################################

      - name: Flutter Version
        run: flutter --version

      ####################################################
      # Dependencies
      ####################################################

      - name: Install Dependencies
        run: flutter pub get

      ####################################################
      # Static Analysis
      ####################################################

      - name: Analyze Project
        run: flutter analyze

      ####################################################
      # Unit Tests
      ####################################################

      - name: Run Tests
        run: flutter test

      ####################################################
      # Android APK
      ####################################################

      - name: Build Android Release APK
        run: flutter build apk --release

      ####################################################
      # iOS Development IPA
      ####################################################

      - name: Build iOS Development IPA
        run: flutter build ipa --export-options-plist=ExportOptions.plist

      ####################################################
      # Verify Output
      ####################################################

      - name: Verify Generated Files
        run: |
          echo "========== APK =========="
          ls -lh build/app/outputs/flutter-apk/

          echo ""
          echo "========== IPA =========="
          ls -lh build/ios/ipa/

          echo ""
          find build -name "*.apk"
          find build -name "*.ipa"

      ####################################################
      # Upload APK Artifact
      ####################################################

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      ####################################################
      # Upload IPA Artifact
      ####################################################

      - name: Upload iOS Development IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-development-ipa
          path: build/ios/ipa/*.ipa

      ####################################################
      # Create Release
      ####################################################

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Release v1.${{ github.run_number }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/ios/ipa/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}